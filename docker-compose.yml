services:
  vakt:
    build: .
    ports:
      # host 8181 → container 8080 (8080 on the host is taken by Coolify's proxy)
      - "8181:8080"
    environment:
      - UNIFI_API_KEY=${UNIFI_API_KEY}
      - UNIFI_CONSOLE_ID=${UNIFI_CONSOLE_ID}
      - UNIFI_NVR_CONSOLE_ID=${UNIFI_NVR_CONSOLE_ID:-}
      - NTFY_URL=${NTFY_URL:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-}
      - TRAFFIC_EXEMPT=${TRAFFIC_EXEMPT:-}
      - DB_PATH=/data/vakt.db
    volumes:
      - vakt-data:/data
    restart: unless-stopped

volumes:
  vakt-data:
